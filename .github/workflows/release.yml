name: Build & Publish APK Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CoE-Chiko-AI-CFO-v1.0.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: "CoE Chiko AI CFO v1.0.0"
          tag_name: "v1.0.0"
          body: |
            ### 🚀 CoE: Chiko AI CFO & Financial Assistant v1.0.0 Release

            - **Privacy-First Net Worth**: Net worth hidden by default with zero/masked balance and eye reveal toggle.
            - **Clean Slate Production**: Completely free of mock/sample amount data, starts at ₹0.
            - **Chiko AI CFO**: Interactive financial intelligence supporting structured tables and audio responses.
            - **Room & Firestore Cloud Sync**: Local-first Room SQLite with Firebase Firestore cloud persistence.
            - **CSV Backup**: Full transaction export and import support.
            - **Shake-to-Log**: Rapid gesture-based transaction logging.
          files: CoE-Chiko-AI-CFO-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
